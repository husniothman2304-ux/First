<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My website</title>
  <meta name="description" content="Projects, notes, blog posts and photos.">
  <meta name="theme-color" content="#ebe5d8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0e0c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23141210'/%3E%3Cpath d='M10 44 C24 40 34 30 54 14' stroke='%23efe9df' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M10 52 C26 48 38 38 54 24' stroke='%23d63b1f' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Markdown rendering + HTML sanitising for posts and notes -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script type="module" src="assets/js/bg.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="paper"></div>
    <svg class="ribbons" id="ribbons" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="grain"></div>
  </div>

  <header class="topbar glass">
    <a id="brand" class="brand" href="#/"></a>
    <nav id="nav-links" aria-label="Main"></nav>
    <div id="nav-actions"></div>
  </header>
  <nav id="tabbar" class="tabbar glass" aria-label="Sections"></nav>

  <div id="banner" class="wrap"></div>
  <main id="view" class="wrap">
    <div class="loading"><div class="spinner"></div></div>
  </main>
  <footer id="footer" class="wrap footer"></footer>

  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="wrap">This website needs JavaScript turned on.</p></noscript>
</body>
</html>
